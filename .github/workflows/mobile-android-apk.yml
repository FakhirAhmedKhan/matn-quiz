name: Matn Quiz Android Release APK

on:
  workflow_dispatch:

  push:
    branches:
      - Mono-Repo
      - main

    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-android-apk.yml"

concurrency:
  group: matn-quiz-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true

    steps:
      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================================
      # 2. PNPM
      # ==========================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      # ==========================================================
      # 3. NODE
      # ==========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ==========================================================
      # 4. JAVA
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 5. CREATE MOBILE ENV
      #
      # IMPORTANT:
      # Add these values in:
      #
      # GitHub Repo
      # -> Settings
      # -> Secrets and variables
      # -> Actions
      #
      # Do NOT commit secrets to Git.
      # ==========================================================

      - name: Create Expo production environment
        shell: bash
        run: |
          NDK_VERSION="27.1.12297006"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both empty."
            exit 1
          fi

          if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION already installed."
            exit 0
          fi

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager could not be found."
            echo "Searching Android SDK:"
            find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "ndk;$NDK_VERSION"

          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo "::error::NDK $NDK_VERSION installation failed."
            exit 1
          fi

          echo "NDK $NDK_VERSION ready."


      - name: Install required Android NDK
        shell: bash
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/27.1.12297006" ]; then
            sdkmanager "ndk;27.1.12297006"
          else
            echo "NDK already available."
          fi

      # ==========================================================
      # 11. PREBUILD
      # ==========================================================

      - name: Generate Android native project
        working-directory: apps/mobile
        shell: bash
        run: |
          rm -rf android

          pnpm exec expo prebuild \
            --platform android \
            --no-install

      - name: Make Gradle executable
        run: chmod +x apps/mobile/android/gradlew

      # ==========================================================
      # 12. GRADLE CACHE
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ==========================================================
      # 13. BUILD STANDALONE RELEASE APK
      #
      # IMPORTANT:
      #
      # assembleRelease
      # NOT
      # assembleDebug
      #
      # ARM64-only makes CI faster for physical modern phones.
      # ==========================================================

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            -PreactNativeArchitectures=arm64-v8a

      # ==========================================================
      # 14. LOCATE RELEASE APK
      # ==========================================================

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          echo "Searching for release APK..."

          find apps/mobile/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find apps/mobile/android/app/build/outputs/apk \
            -type f \
            -name "*release*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK was not generated."
            exit 1
          fi

          if [ ! -f "$APK" ]; then
            echo "APK file does not exist."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK generated:"
          ls -lh "$APK"

      # ==========================================================
      # 15. PREPARE DOWNLOAD
      # ==========================================================

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p artifacts

          cp \
            "$APK" \
            artifacts/matn-quiz-release-arm64.apk

          ls -lh artifacts/matn-quiz-release-arm64.apk

      # ==========================================================
      # 16. UPLOAD APK
      # ==========================================================

      - name: Upload Matn Quiz APK
        uses: actions/upload-artifact@v4
        with:
          name: matn-quiz-release-apk-${{ github.run_number }}
          path: artifacts/matn-quiz-release-arm64.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # ==========================================================
      # 17. SUMMARY
      # ==========================================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ✅ Matn Quiz Standalone Android APK"
            echo ""
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Build:** Release"
            echo ""
            echo "**Architecture:** arm64-v8a"
            echo ""
            echo "**Artifact:**"
            echo ""
            echo "\`matn-quiz-release-apk-${GITHUB_RUN_NUMBER}\`"
            echo ""
            echo "APK:"
            echo ""
            echo "\`matn-quiz-release-arm64.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
